###########
## General
###########

script-opts=ytdl_hook-ytdl_path=yt-dlp,try_ytdl_first=yes

use-filedir-conf                        # Allow per-file configs (technically a security risk)
#no-border                              # no window title bar
msg-module                              # prepend module name to log messages
msg-color                               # color log messages on terminal
term-osd-bar                            # display a progress bar on the terminal
stop-screensaver = "yes"

###########
## Audio
###########
audio-pitch-correction=yes              # automatically insert scaletempo when playing with higher speed
alang=jpn,

###########
## Video output
###########
#vo=gpu,
#profile=gpu-hq
#hwdec=vaapi

# If multiple monitors are connected, fullscreen onto the second
#fs-screen=2

###audio-device=pulse/homegroup_chromecast

#cache=yes
#cache-on-disk=yes
demuxer-max-bytes=100MiB
demuxer-max-back-bytes=25MiB
cache-dir=/home/gregdarke/tmp/
cache-secs=180                           # how many seconds of audio/video to prefetch

# Don't bother with:
#  - 60fps, it is much more expensive to decode.
#  - video over 1080p
#  - vp9 (aka, prefer h264, as hardware decoding is better for battery)
#ytdl-format='bestvideo[height<=?1080][fps<=?30][vcodec!=?vp9]+bestaudio/best'

###video-rotate = 180

###################################
# Protocol Specific Configuration #
###################################

[protocol.https]
cache=yes
cache-on-disk=yes
demuxer-max-bytes=100MiB
demuxer-max-back-bytes=25MiB
cache-dir=/home/gregdarke/tmp/
cache-secs=60                           # how many seconds of audio/video to prefetch
#no-cache-pause                         # if the player should pause when the cache runs low
#user-agent='Mozilla/5.0 (Macintosh; Intel Mac OS X 10.10; rv:37.0) Gecko/20100101 Firefox/37.0'
user-agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/46.0.2490.80 Safari/537.36'

[protocol.http]
cache=yes
cache-on-disk=yes
demuxer-max-bytes=100MiB
demuxer-max-back-bytes=25MiB
cache-dir=/home/gregdarke/tmp/
cache-secs=60                           # how many seconds of audio/video to prefetch
#no-cache-pause                         # if the player should pause when the cache runs low
#user-agent='Mozilla/5.0 (Macintosh; Intel Mac OS X 10.10; rv:37.0) Gecko/20100101 Firefox/37.0'
user-agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/46.0.2490.80 Safari/537.36'

