[Service]
# Explicitly specity a value for "SNAP" to stop chromium from creating a
# systemd scope that contains only _some_ of the child processes.
Environment="SNAP=foo"
ExecStart=
ExecStart="/usr/bin/signal-desktop" --enable-features=UseOzonePlatform,WaylandWindowDecorations --ozone-platform=wayland --password-store=gnome-libsecret
